
name: ESP-IDF Build

on:
  push:
    branches: [master]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ESP32-C3 blink
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1
          target: esp32c3
          path: examples/get-started/blink


      - name: Prepare Blink flash bundle
        shell: bash
        working-directory: examples/get-started/blink/build
        run: |
          bundle="$RUNNER_TEMP/blink_flash_bundle"
          mkdir -p "$bundle"

          for file in blink.bin flash_args bootloader/bootloader.bin partition_table/partition-table.bin; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing build file: $PWD/$file"
              exit 1
            fi
            cp --parents "$file" "$bundle/"
          done
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: blink_flash_bundle
          path: ${{ runner.temp }}/blink_flash_bundle
          if-no-files-found: error
